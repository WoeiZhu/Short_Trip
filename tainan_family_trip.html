<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台南兩天一夜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 SortableJS 用於拖曳排序 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- 引入 Firebase (Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
        .timeline-line {
            position: absolute; left: 24px; top: 40px; bottom: -20px;
            width: 2px; background-color: #e5e7eb; z-index: 0;
        }
        .timeline-dot { position: relative; z-index: 1; }
        .img-hover-zoom { transition: transform 0.5s ease; }
        .img-hover-zoom:hover { transform: scale(1.05); }
        .timeline-item:last-child .timeline-line { display: none; }
        
        /* 拖曳時的樣式 */
        .sortable-ghost { opacity: 0.4; background-color: #f9fafb; border-radius: 0.5rem; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        
        /* 隱藏捲軸但可滾動 (Modal用) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 同步狀態指示 */
        #sync-status {
            position: fixed; bottom: 16px; right: 16px; z-index: 40;
            font-size: 11px; padding: 4px 10px; border-radius: 999px;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: all 0.3s;
        }
    </style>
</head>
<body class="text-gray-800 pb-20 relative">

    <!-- 同步狀態小標籤 -->
    <div id="sync-status" class="bg-gray-800 text-white">
        <i class="fas fa-circle-notch fa-spin"></i> <span id="sync-status-text">連線中...</span>
    </div>

    <!-- 頂部導航 / 封面 -->
    <div id="banner-bg" class="relative h-64 w-full bg-cover bg-center transition-all duration-500" style="background-image: url('https://images.unsplash.com/photo-1578465191845-f09db0cdcf3c?auto=format&fit=crop&q=80&w=1200');">
        <div class="absolute inset-0 bg-black bg-opacity-40"></div>
        
        <!-- 編輯封面按鈕 (改為輸入網址) -->
        <button onclick="changeBannerUrl()" class="absolute bottom-6 right-6 bg-white bg-opacity-20 hover:bg-opacity-90 text-white hover:text-gray-800 w-10 h-10 flex items-center justify-center rounded-full shadow-lg transition-all backdrop-blur-sm z-10" title="更換封面圖片網址">
            <i class="fas fa-link text-lg"></i>
        </button>

        <div class="absolute top-4 left-4">
            <a href="index.html" class="bg-white bg-opacity-80 text-gray-800 px-4 py-2 rounded-full font-bold shadow-md hover:bg-white transition flex items-center gap-2 text-sm backdrop-blur-sm">
                <i class="fas fa-arrow-left"></i> 首頁
            </a>
        </div>
        <!-- 匯出/匯入工具列 -->
        <div class="absolute top-4 right-4 flex gap-2">
            <button onclick="exportData()" class="bg-blue-600 bg-opacity-90 text-white px-3 py-2 rounded-full font-bold shadow-md hover:bg-blue-700 transition flex items-center gap-2 text-xs backdrop-blur-sm">
                <i class="fas fa-share-nodes"></i> 匯出分享
            </button>
            <button onclick="importData()" class="bg-emerald-600 bg-opacity-90 text-white px-3 py-2 rounded-full font-bold shadow-md hover:bg-emerald-700 transition flex items-center gap-2 text-xs backdrop-blur-sm">
                <i class="fas fa-download"></i> 匯入
            </button>
        </div>
        <div class="absolute bottom-6 left-6 text-white">
            <span class="bg-purple-600 text-xs px-2 py-1 rounded-md font-bold mb-2 inline-block shadow"><i class="fas fa-cloud"></i> 雲端同步版</span>
            <h1 class="text-3xl font-black drop-shadow-lg">台南兩天一夜</h1>
            <p class="text-sm font-medium mt-1 drop-shadow-md opacity-90"><i class="fas fa-info-circle"></i> 可拖曳排序、點擊修改行程，任何裝置編輯後自動同步</p>
        </div>
    </div>

    <!-- 主要內容區 -->
    <div class="max-w-2xl mx-auto px-4 mt-6">

        <!-- ================= DAY 1 ================= -->
        <div class="mb-10 bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
            <div class="bg-blue-50 px-5 py-4 border-b border-blue-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-blue-800"><i class="fas fa-flag text-blue-500 mr-2"></i>Day 1: 動物生態與蓮花溫泉</h2>
                <button onclick="openModal('day1')" class="text-sm bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1 font-bold">
                    <i class="fas fa-plus"></i> 新增
                </button>
            </div>
            
            <div class="p-4 bg-gray-50 border-b border-gray-100">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-gray-700 text-sm"><i class="fas fa-map-marked-alt text-gray-500 mr-1"></i> 路線圖</h3>
                    <a href="https://www.google.com/maps/dir/高雄/頑皮世界野生動物園/學甲區/白河蓮花公園/關子嶺富野溫泉會館/關子嶺紅雞城" target="_blank" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-1.5 px-3 rounded-lg shadow-sm transition flex items-center gap-1">
                        <i class="fas fa-location-arrow"></i> 導航

            <!-- 動態渲染 Day 1 列表 -->
            <div id="day1-list" class="px-5 py-6"></div>
        </div>

        <!-- ================= DAY 2 ================= -->
        <div class="mb-10 bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
            <div class="bg-emerald-50 px-5 py-4 border-b border-emerald-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-emerald-800"><i class="fas fa-leaf text-emerald-500 mr-2"></i>Day 2: 山林奇景與彈性探索</h2>
                <button onclick="openModal('day2')" class="text-sm bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1 font-bold">
                    <i class="fas fa-plus"></i> 新增
                </button>
            </div>
            
            <div class="p-4 bg-gray-50 border-b border-gray-100">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-gray-700 text-sm"><i class="fas fa-map-marked-alt text-gray-500 mr-1"></i> 路線圖</h3>
                    <a href="https://www.google.com/maps/dir/關子嶺富野溫泉會館/水火同源/左鎮化石園區/魚翅火鍋" target="_blank" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-1.5 px-3 rounded-lg shadow-sm transition flex items-center gap-1">
                        <i class="fas fa-location-arrow"></i> 導航

            </div>

            <!-- 動態渲染 Day 2 列表 -->
            <div id="day2-list" class="px-5 py-6"></div>
        </div>
        
        <div class="text-center py-6 mb-10">
            <button onclick="resetData()" class="text-gray-400 hover:text-red-500 text-sm underline transition">
                重置回預設行程
            </button>
        </div>
    </div>

    <!-- 編輯/新增 Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-gray-100 px-5 py-3 border-b flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-lg text-gray-800">編輯行程</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="p-5 overflow-y-auto no-scrollbar flex-1">
                <input type="hidden" id="item-id">
                <input type="hidden" id="item-day">
                
                <div class="mb-4 flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-500 mb-1">時間</label>
                        <input type="text" id="item-time" placeholder="例如: 08:30" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-500 mb-1">顏色</label>
                        <select id="item-color" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="blue">藍色</option>
                            <option value="green">綠色</option>
                            <option value="orange">橘色</option>
                            <option value="red">紅色</option>
                            <option value="purple">紫色</option>
                            <option value="pink">粉色</option>
                            <option value="stone">灰色</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4 flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-500 mb-1">圖標 (FontAwesome)</label>
                        <select id="item-icon" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="fa-car">🚗 汽車 (fa-car)</option>
                            <option value="fa-hippo">🦛 動物 (fa-hippo)</option>
                            <option value="fa-mountain">⛰️ 山 (fa-mountain)</option>
                            <option value="fa-store">🏪 商店 (fa-store)</option>
                            <option value="fa-utensils">🍽️ 餐廳 (fa-utensils)</option>
                            <option value="fa-hotel">🏨 飯店 (fa-hotel)</option>
                            <option value="fa-fire-alt">🔥 火焰 (fa-fire-alt)</option>
                            <option value="fa-bone">🦴 化石 (fa-bone)</option>
                            <option value="fa-camera">📷 拍照 (fa-camera)</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 mb-1">標題</label>
                    <input type="text" id="item-title" placeholder="景點或活動名稱" class="w-full border rounded-lg px-3 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 mb-1">說明文字</label>
                    <textarea id="item-desc" rows="3" placeholder="行程細節..." class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div class="mb-2">
                    <label class="block text-xs font-bold text-gray-500 mb-1">圖片網址 (選填)</label>
                    <input type="text" id="item-img" placeholder="https://..." class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div class="bg-gray-50 px-5 py-3 border-t flex justify-between items-center gap-2">
                <button id="btn-delete" onclick="deleteItem()" class="text-red-500 hover:bg-red-50 px-3 py-2 rounded-lg text-sm font-bold transition">
                    <i class="fas fa-trash-alt"></i> 刪除
                </button>
                <div class="flex gap-2">
                    <button onclick="closeModal()" class="text-gray-600 hover:bg-gray-200 px-4 py-2 rounded-lg text-sm font-bold transition">取消</button>
                    <button onclick="saveModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-bold shadow transition">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // ★★★ 請把下面換成你自己在 Firebase Console 複製出來的 firebaseConfig ★★★
        // Console → Project settings → 一般設定 → 你的應用程式 → SDK 設定和配置
        // =====================================================================
        const firebaseConfig = {
  	 apiKey: "AIzaSyAEXW6NRzYxXlaFEAjIyc5i0EBMJCtEdLA",
 	 authDomain: "short-trip-cdb79.firebaseapp.com",
 	 databaseURL: "https://short-trip-cdb79-default-rtdb.asia-southeast1.firebasedatabase.app",
 	 projectId: "short-trip-cdb79",
 	 storageBucket: "short-trip-cdb79.firebasestorage.app",
 	 messagingSenderId: "467553960521",
 	 appId: "1:467553960521:web:6135a2daedde8aa394f598",
 	 measurementId: "G-0THHP0CGRN"
	};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tripRef = db.ref('trips/tainan');

        // 預設資料 (Firebase 尚無任何資料時，第一次會自動寫入這份當初始值)
        const defaultData = {
            day1: [
                { id: '1-1', time: '08:30', title: '出發・沿西濱向北', desc: '從高雄出發。趁早晨精神好直奔主題樂園，車上時間讓孩子補個眠。', icon: 'fa-car', color: 'blue', img: '' },
                { id: '1-2', time: '09:30', title: '頑皮世界野生動物園', desc: '趁早上氣溫涼爽，近距離餵食水豚與草羊駝。快中午時可躲進「兩棲爬蟲館」吹冷氣。', icon: 'fa-hippo', color: 'green', img: 'https://www.abic.com.tw/upload/wanpi/70.jpg' },
                { id: '1-3', time: '12:30', title: '學甲・午餐時光', desc: '離開動物園後，就近前往學甲市區。可找間評價不錯的小吃店簡單填飽肚子。', icon: 'fa-store', color: 'orange', img: 'https://pimg.1px.tw/blue90184/1758094318-1122015345-g.jpg' },
                { id: '1-4', time: '14:00', title: '白河大王蓮', desc: '來到白河區，體驗乘坐「大王蓮」。小朋友坐在巨大的蓮葉上拍照非常吸睛，是難得的生態體驗！', icon: 'fa-camera', color: 'pink', img: 'https://cdn2.ettoday.net/images/2673/d2673609.jpg' },
                { id: '1-5', time: '15:30', title: '入住：富野溫泉會館', desc: '開車上山進飯店。在舒適冷氣房內安頓行李、沖洗汗水，避開南部午後最悶熱的時段，或直接享受泥漿溫泉。', icon: 'fa-hotel', color: 'purple', img: '' },
                { id: '1-6', time: '17:30', title: '晚餐：關子嶺紅雞城', desc: '氣溫轉涼後出門享用特色晚餐。必點招牌「甕窯雞」，外皮酥脆肉質多汁，搭配雞油拌飯與野菜超滿足。', icon: 'fa-utensils', color: 'red', img: 'https://images.unsplash.com/photo-1598514982205-f36b96d1e8d4?auto=format&fit=crop&q=80&w=600' }
            ],
            day2: [
                { id: '2-1', time: '08:00', title: '悠閒晨光與退房', desc: '享用飯店早餐，享受山林晨間涼爽舒適的空氣，隨後整理行李辦理退房。', icon: 'fa-hotel', color: 'purple', img: '' },
                { id: '2-2', time: '10:30', title: '水火同源', desc: '順路造訪岩壁洞穴景點，觀賞天然氣與泉水共存燃燒的奇景。木棧道平緩，推車好走。', icon: 'fa-fire-alt', color: 'red', img: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmPE2E5z9xixyICbZu1C01nHj4vOjCSFXsnViPDiyXNHeh1KJdk0eaVJ1kpWb5d-DPIZk0_xfRl3HnpWZKJBdHrBfdRV3lT-B4CvA_2ERhGMoOUrvJXZ8wD7ZC9xWiJbWVDeyqxBQ=s1360-w1360-h1020-rw' },
                { id: '2-3', time: '12:30', title: '左鎮化石園區', desc: '全館室內冷氣開放，無障礙設施極佳。豐富恐龍與古生物標本讓孩子舒適探索。', icon: 'fa-bone', color: 'stone', img: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWl0P4PYBgKCstpjP-z0TKxcxZAhUeyudYPrQIwq07PX4H4PBux_yskhSv-nlq1Xp6PG7rZlRrZTa7WWSAl4npfyTwctn3eDnZwWNi2SlZGAFaau8LJz5ztCXMuAeuz3tVOHgPn9=s1360-w1360-h1020-rw' },
                { id: '2-4', time: '17:00', title: '晚餐：魚翅火鍋', desc: '結束一天的行程，在回高雄的順路途中，找一間熱呼呼、湯頭鮮美的魚翅火鍋犒賞全家人！', icon: 'fa-utensils', color: 'blue', img: '' }
            ]
        };
        const defaultBanner = 'https://images.unsplash.com/photo-1578465191845-f09db0cdcf3c?auto=format&fit=crop&q=80&w=1200';

        let itineraryData = { day1: [], day2: [] };
        let bannerUrl = defaultBanner;
        let sortableInitialized = false;

        // 顏色映射表
        const colorMap = {
            blue: { bg: 'bg-blue-100', text: 'text-blue-600' },
            green: { bg: 'bg-green-100', text: 'text-green-600' },
            orange: { bg: 'bg-orange-100', text: 'text-orange-600' },
            red: { bg: 'bg-red-100', text: 'text-red-500' },
            purple: { bg: 'bg-purple-100', text: 'text-purple-600' },
            pink: { bg: 'bg-pink-100', text: 'text-pink-600' },
            stone: { bg: 'bg-stone-200', text: 'text-stone-600' }
        };

        function setSyncStatus(state) {
            const el = document.getElementById('sync-status');
            const text = document.getElementById('sync-status-text');
            if (state === 'connected') {
                el.className = 'bg-emerald-600 text-white';
                el.querySelector('i').className = 'fas fa-cloud';
                text.innerText = '已同步';
                setTimeout(() => { el.style.opacity = '0.5'; }, 1500);
            } else if (state === 'connecting') {
                el.style.opacity = '1';
                el.className = 'bg-gray-800 text-white';
                el.querySelector('i').className = 'fas fa-circle-notch fa-spin';
                text.innerText = '連線中...';
            } else if (state === 'error') {
                el.style.opacity = '1';
                el.className = 'bg-red-600 text-white';
                el.querySelector('i').className = 'fas fa-triangle-exclamation';
                text.innerText = '連線失敗';
            } else if (state === 'saving') {
                el.style.opacity = '1';
                el.className = 'bg-blue-600 text-white';
                el.querySelector('i').className = 'fas fa-circle-notch fa-spin';
                text.innerText = '儲存中...';
            }
        }

        // 初始化：監聽 Firebase 即時資料
        function init() {
            setSyncStatus('connecting');

            tripRef.on('value', (snapshot) => {
                const data = snapshot.val();

                if (data && data.itinerary) {
                    itineraryData = data.itinerary;
                    bannerUrl = data.banner || defaultBanner;
                } else {
                    // 資料庫是空的：第一次使用，寫入預設行程當初始值
                    itineraryData = JSON.parse(JSON.stringify(defaultData));
                    bannerUrl = defaultBanner;
                    tripRef.set({ itinerary: itineraryData, banner: bannerUrl });
                }

                document.getElementById('banner-bg').style.backgroundImage = `url('${bannerUrl}')`;
                renderDay('day1');
                renderDay('day2');

                if (!sortableInitialized) {
                    initSortable();
                    sortableInitialized = true;
                }

                setSyncStatus('connected');
            }, (error) => {
                console.error('Firebase 讀取失敗:', error);
                setSyncStatus('error');
            });
        }

        // 渲染單日行程
        function renderDay(dayKey) {
            const container = document.getElementById(`${dayKey}-list`);
            container.innerHTML = '';
            
            (itineraryData[dayKey] || []).forEach((item) => {
                const cMap = colorMap[item.color] || colorMap.blue;
                const imgHtml = item.img ? `
                    <div class="rounded-xl overflow-hidden h-40 bg-gray-100 mb-2 mt-2">
                        <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover img-hover-zoom">
                    </div>` : '';

                const html = `
                    <div class="relative pl-12 mb-8 timeline-item group" data-id="${item.id}">
                        <div class="timeline-line"></div>
                        <div class="timeline-dot absolute left-0 top-0 w-8 h-8 rounded-full ${cMap.bg} border-4 border-white shadow flex items-center justify-center ${cMap.text} text-xs">
                            <i class="fas ${item.icon}"></i>
                        </div>
                        <div class="bg-white border border-transparent group-hover:border-gray-200 group-hover:shadow-md rounded-xl p-3 -mt-3 transition-all relative">
                            <div class="absolute right-2 top-2 opacity-0 group-hover:opacity-100 transition flex gap-2">
                                <button onclick="editItem('${dayKey}', '${item.id}')" class="w-8 h-8 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center hover:bg-blue-100">
                                    <i class="fas fa-pencil-alt"></i>
                                </button>
                                <div class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center drag-handle hover:text-gray-700">
                                    <i class="fas fa-grip-vertical"></i>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-2 mb-1 pr-16">
                                <h3 class="font-bold text-lg text-gray-800">${item.title}</h3>
                                <span class="text-xs text-gray-500 font-bold bg-gray-100 px-2 py-0.5 rounded">${item.time}</span>
                            </div>
                            <p class="text-sm text-gray-600 whitespace-pre-line leading-relaxed">${item.desc}</p>
                            ${imgHtml}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // 初始化拖曳功能 (只需綁定一次，容器本身不會被替換)
        function initSortable() {
            ['day1', 'day2'].forEach(dayKey => {
                const el = document.getElementById(`${dayKey}-list`);
                new Sortable(el, {
                    handle: '.drag-handle',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: function (evt) {
                        const movedItem = itineraryData[dayKey].splice(evt.oldIndex, 1)[0];
                        itineraryData[dayKey].splice(evt.newIndex, 0, movedItem);
                        renderDay(dayKey);
                        saveData();
                    },
                });
            });
        }

        // 寫入 Firebase (取代原本的 localStorage)
        function saveData() {
            setSyncStatus('saving');
            tripRef.set({
                itinerary: itineraryData,
                banner: bannerUrl
            }).then(() => {
                setSyncStatus('connected');
            }).catch((err) => {
                console.error('儲存失敗:', err);
                setSyncStatus('error');
                alert('儲存失敗，請檢查網路連線後再試一次');
            });
        }

        function resetData() {
            if(confirm("確定要放棄所有修改，還原成最初的行程嗎？")) {
                itineraryData = JSON.parse(JSON.stringify(defaultData));
                bannerUrl = defaultBanner;
                document.getElementById('banner-bg').style.backgroundImage = `url('${bannerUrl}')`;
                renderDay('day1');
                renderDay('day2');
                saveData();
            }
        }

        // Modal 操作
        function openModal(dayKey, itemId = null) {
            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('item-day').value = dayKey;
            
            if (itemId) {
                document.getElementById('modal-title').innerText = '編輯行程';
                document.getElementById('btn-delete').classList.remove('hidden');
                
                const item = itineraryData[dayKey].find(i => i.id === itemId);
                document.getElementById('item-id').value = item.id;
                document.getElementById('item-time').value = item.time;
                document.getElementById('item-title').value = item.title;
                document.getElementById('item-desc').value = item.desc;
                document.getElementById('item-color').value = item.color;
                document.getElementById('item-icon').value = item.icon;
                document.getElementById('item-img').value = item.img || '';
            } else {
                document.getElementById('modal-title').innerText = '新增行程';
                document.getElementById('btn-delete').classList.add('hidden');
                
                document.getElementById('item-id').value = 'new-' + Date.now();
                document.getElementById('item-time').value = '';
                document.getElementById('item-title').value = '';
                document.getElementById('item-desc').value = '';
                document.getElementById('item-color').value = 'blue';
                document.getElementById('item-icon').value = 'fa-camera';
                document.getElementById('item-img').value = '';
            }
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function editItem(dayKey, itemId) {
            openModal(dayKey, itemId);
        }

        function saveModal() {
            const dayKey = document.getElementById('item-day').value;
            const itemId = document.getElementById('item-id').value;
            
            const newData = {
                id: itemId,
                time: document.getElementById('item-time').value,
                title: document.getElementById('item-title').value || '未命名行程',
                desc: document.getElementById('item-desc').value,
                color: document.getElementById('item-color').value,
                icon: document.getElementById('item-icon').value,
                img: document.getElementById('item-img').value
            };

            const index = itineraryData[dayKey].findIndex(i => i.id === itemId);
            if (index > -1) {
                itineraryData[dayKey][index] = newData;
            } else {
                itineraryData[dayKey].push(newData);
            }
            
            renderDay(dayKey);
            saveData();
            closeModal();
        }

        function deleteItem() {
            if(confirm("確定要刪除這個行程嗎？")) {
                const dayKey = document.getElementById('item-day').value;
                const itemId = document.getElementById('item-id').value;
                
                itineraryData[dayKey] = itineraryData[dayKey].filter(i => i.id !== itemId);
                renderDay(dayKey);
                saveData();
                closeModal();
            }
        }

        // 匯出 / 匯入功能 (仍保留，作為離線備份/分享用)
        function exportData() {
            const exportObj = {
                itinerary: itineraryData,
                banner: bannerUrl
            };
            const dataStr = btoa(encodeURIComponent(JSON.stringify(exportObj)));
            try {
                navigator.clipboard.writeText(dataStr);
                const toast = document.createElement('div');
                toast.className = "fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg z-50 text-sm";
                toast.innerHTML = '<i class="fas fa-check-circle text-green-400"></i> 行程代碼已複製！趕快貼上傳給朋友吧！';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            } catch (err) {
                const input = document.createElement('input');
                input.value = dataStr;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
            }
        }

        function importData() {
            const importModal = document.createElement('div');
            importModal.className = "fixed inset-0 bg-black bg-opacity-60 z-[60] flex items-center justify-center px-4 backdrop-blur-sm";
            importModal.innerHTML = `
                <div class="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
                    <h3 class="font-bold text-lg mb-2 text-gray-800">匯入行程代碼</h3>
                    <p class="text-xs text-gray-500 mb-4">貼上朋友分享給您的代碼。注意：這將會覆蓋雲端目前的行程，所有裝置都會看到新版本。</p>
                    <textarea id="import-text" rows="4" class="w-full border rounded-lg p-2 text-xs mb-4 outline-none focus:border-blue-500" placeholder="貼上代碼..."></textarea>
                    <div class="flex justify-end gap-2">
                        <button id="cancel-import" class="px-4 py-2 text-sm text-gray-500 font-bold hover:bg-gray-100 rounded-lg transition">取消</button>
                        <button id="confirm-import" class="px-4 py-2 text-sm bg-emerald-600 text-white font-bold rounded-lg shadow hover:bg-emerald-700 transition">確定匯入</button>
                    </div>
                </div>
            `;
            document.body.appendChild(importModal);

            document.getElementById('cancel-import').onclick = () => importModal.remove();
            
            document.getElementById('confirm-import').onclick = () => {
                const code = document.getElementById('import-text').value.trim();
                if(code) {
                    try {
                        const parsedData = JSON.parse(decodeURIComponent(atob(code)));
                        if(parsedData.itinerary) {
                            itineraryData = parsedData.itinerary;
                            bannerUrl = parsedData.banner || defaultBanner;
                        } else if(parsedData.day1 && parsedData.day2) {
                            itineraryData = parsedData;
                        } else {
                            throw new Error("Invalid format");
                        }
                        
                        document.getElementById('banner-bg').style.backgroundImage = `url('${bannerUrl}')`;
                        renderDay('day1');
                        renderDay('day2');
                        saveData();
                        importModal.remove();
                    } catch(e) {
                        const errorMsg = document.createElement('div');
                        errorMsg.className = "text-red-500 text-xs mt-2 font-bold";
                        errorMsg.innerText = "代碼格式錯誤，請確認是否有複製完整。";
                        document.getElementById('import-text').after(errorMsg);
                    }
                }
            };
        }

        // 處理封面圖片更改
        function changeBannerUrl() {
            const bgModal = document.createElement('div');
            bgModal.className = "fixed inset-0 bg-black bg-opacity-60 z-[60] flex items-center justify-center px-4 backdrop-blur-sm transition-opacity";
            bgModal.innerHTML = `
                <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-all">
                    <h3 class="font-bold text-lg mb-2 text-gray-800"><i class="fas fa-image text-blue-500 mr-2"></i>更換封面圖片</h3>
                    <p class="text-xs text-gray-500 mb-4">請貼上您喜歡的圖片網址。更換後會同步到雲端，所有裝置都會看到新封面。</p>
                    <input type="text" id="bg-url-input" class="w-full border border-gray-300 rounded-lg p-3 text-sm mb-5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition" placeholder="https://..." value="${bannerUrl}">
                    <div class="flex justify-end gap-3">
                        <button id="cancel-bg" class="px-4 py-2 text-sm text-gray-600 font-bold hover:bg-gray-100 rounded-lg transition">取消</button>
                        <button id="confirm-bg" class="px-4 py-2 text-sm bg-blue-600 text-white font-bold rounded-lg shadow hover:bg-blue-700 transition">確定更換</button>
                    </div>
                </div>
            `;
            document.body.appendChild(bgModal);

            const inputElement = document.getElementById('bg-url-input');
            inputElement.select();

            document.getElementById('cancel-bg').onclick = () => bgModal.remove();
            
            document.getElementById('confirm-bg').onclick = () => {
                const url = inputElement.value.trim();
                if (url) {
                    bannerUrl = url;
                    document.getElementById('banner-bg').style.backgroundImage = `url('${bannerUrl}')`;
                    saveData();
                    
                    const toast = document.createElement('div');
                    toast.className = "fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg z-50 text-sm";
                    toast.innerHTML = '<i class="fas fa-check-circle text-green-400"></i> 封面已成功更新！';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2500);
                }
                bgModal.remove();
            };
        }

        window.onload = init;
    </script>
</body>
</html>
